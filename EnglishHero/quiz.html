<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 考單字</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("eh_theme") || "null");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=3400">
</head>
<body>

<header class="main-header">
  <div class="logo"><a href="index.html?v=3000">🎯 考單字</a></div>
  <div class="user-panel">
    <a href="index.html?v=3000" class="btn-back">回首頁</a>
  </div>
</header>

<main class="page">
  <div class="card">

    <!-- 第一層：測驗模式 -->
    <div class="tabs">
      <button type="button" id="main-tab-fill" class="tab active">✏️ 填空測驗</button>
      <button type="button" id="main-tab-match" class="tab">🎴 選擇配對</button>
    </div>

    <!-- 範圍與題數 -->
    <div class="quiz-settings">
      <div class="form-group">
        <label for="quiz-folder-select">🎯 測驗範圍</label>
        <select id="quiz-folder-select">
          <option value="ALL">全部資料夾 (綜合測驗)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="quiz-count">🔢 題數</label>
        <select id="quiz-count">
          <option value="srs">🧠 今日複習（間隔複習）</option>
          <option value="10">10 題</option>
          <option value="20">20 題</option>
          <option value="30">30 題</option>
          <option value="50">50 題</option>
          <option value="0">全部</option>
        </select>
      </div>
      <div id="sub-folder-select-container" class="form-group full hidden">
        <label for="quiz-sub-folder-select">📂 子資料夾</label>
        <select id="quiz-sub-folder-select">
          <option value="ALL_SUB">-- 選擇子資料夾 (全部) --</option>
        </select>
      </div>
    </div>

    <!-- 間隔複習說明（選了「今日複習」才顯示） -->
    <div id="srs-info" class="bulk-help hidden"></div>

    <!-- 第二層：配對方向（只有「選擇配對」才顯示） -->
    <div id="sub-mode-box" class="tabs hidden">
      <button type="button" id="sub-tab-en-ch" class="tab active">🔤 看英選中</button>
      <button type="button" id="sub-tab-ch-en" class="tab">🇹🇼 看中選英</button>
    </div>

    <!-- 填空畫面 -->
    <div id="mode-fill">
      <p class="muted" style="text-align:center; padding:24px;">載入單字中...</p>
    </div>

    <!-- 選擇配對畫面 -->
    <div id="mode-match" class="hidden">
      <div id="match-hud"></div>
      <div class="quiz-question" id="match-question">載入單字中...</div>
      <div class="options-grid" id="options-container"></div>
      <div class="feedback" id="match-feedback"></div>
    </div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=3400"></script>
<script src="js/quiz.js?v=3400"></script>
<script>
  // 診斷：程式沒載入成功時，直接在頁面上提示
  if (!window.EH || !window.__EH_QUIZ_READY) {
    var b = document.createElement("div");
    b.className = "auth-msg error";
    b.textContent = !window.EH
      ? "⚠️ 找不到 js/common.js，請確認它放在 js 資料夾內並重新整理。"
      : "⚠️ js/quiz.js 沒有正確載入（可能是舊版或檔案有誤），請覆蓋最新的 quiz.js 並清除瀏覽器快取。";
    var c = document.querySelector(".card");
    c.insertBefore(b, c.firstChild);
  }
</script>
</body>
</html>
