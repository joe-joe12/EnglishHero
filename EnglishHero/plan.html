<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 每日連續學習計畫</title>
  <link rel="stylesheet" href="css/style.css?v=2074">
  <style>
    body { background: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
    
    /* 統一的頂部導覽列風格 */
    .main-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #fff; border-bottom: 1px solid #e2e8f0; margin-bottom: 30px; }
    .main-header .logo a { font-size: 22px; font-weight: bold; color: #16a34a; text-decoration: none; }
    .btn-back-home { padding: 8px 18px; background: #fff; border: 1px solid #cbd5e1; color: #475569; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; }
    .btn-back-home:hover { background: #f1f5f9; }

    .plan-container { max-width: 650px; margin: 0 auto 40px auto; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); padding: 28px; box-sizing: border-box; }
    
    .section-title { font-size: 18px; font-weight: bold; color: #1e293b; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .hidden { display: none; }
    
    .word-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; background: #f8fafc; margin-top: 6px; border-radius: 8px; border: 1px solid #e2e8f0; }
    .word-en { font-size: 16px; font-weight: bold; color: #1d4ed8; }
    .word-pos { font-size: 12px; background: #e0f2fe; color: #0284c7; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .word-ch { font-size: 15px; font-weight: bold; color: #334155; }
  </style>
</head>
<body>

<!-- 統一的標準頂部標題列 -->
<header class="main-header">
  <div class="logo">
    <a href="index.html">📚 English Hero - 背單字</a>
  </div>
  <div>
    <a href="index.html" class="btn-back-home">回首頁</a>
  </div>
</header>

<div class="plan-container">
  
  <h2 style="margin-top: 0; color: #1e293b; font-size: 22px; margin-bottom: 24px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px;">🎯 建立全域連續學習計畫</h2>

  <div class="section-title">1. 設定各資料夾預計背完的天數：</div>
  <div id="folder-settings-container" style="margin-bottom: 24px;">
    <p style="color: #64748b; text-align: center; padding: 15px;">載入資料夾中...</p>
  </div>

  <div class="section-title">2. 選擇你要預習/載入的是第幾天 (Day)：</div>
  <div style="margin-bottom: 24px;">
    <input type="number" id="target-day" min="1" value="1" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; box-sizing: border-box;">
  </div>

  <button onclick="generateGlobalPlan()" style="width: 100%; padding: 14px; background: #4f46e5; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 12px rgba(79,70,229,0.25);">
    🚀 預覽全域連續計畫
  </button>

  <!-- 預覽與寫入區塊 -->
  <div id="plan-result" class="hidden" style="margin-top: 30px; border-top: 2px dashed #cbd5e1; padding-top: 20px;">
    <h3 id="plan-title" style="color: #1e293b; font-size: 18px; margin-bottom: 12px;"></h3>
    
    <div id="daily-words-container" style="max-height: 350px; overflow-y: auto; margin-bottom: 20px; padding-right: 4px;"></div>

    <button onclick="saveGlobalPlanToCloud()" style="width: 100%; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; box-shadow: 0 4px 12px rgba(16,185,129,0.25);">
      🎯 將此天度加入「🎯 今日背誦計畫」資料夾
    </button>
  </div>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="js/plan.js?v=2099"></script>
</body>
</html>
