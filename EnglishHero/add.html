<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero - 新增單字</title>
  <script>
    try {
      var t = JSON.parse(localStorage.getItem("eh_theme") || "null");
      document.documentElement.dataset.theme = t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css?v=3400">
</head>
<body>

<header class="main-header">
  <div class="logo"><a href="index.html?v=3000">➕ 新增單字</a></div>
  <div class="user-panel">
    <a href="index.html?v=3000" class="btn-back">回首頁</a>
  </div>
</header>

<main class="page">
  <div class="card">
    <h2 style="text-align:center; margin-bottom:18px;">擴充單字庫</h2>

    <!-- 資料夾選擇（單筆 / 批次共用） -->
    <div class="form-group">
      <label for="folder-select">📁 選擇分類資料夾</label>
      <div class="folder-input-group">
        <select id="folder-select"><option value="">載入資料夾中...</option></select>
        <button type="button" id="btn-toggle-new-folder" class="btn btn-secondary">＋ 新增資料夾</button>
      </div>
    </div>

    <div class="form-group hidden" id="new-folder-group">
      <label for="new-folder-input">✨ 輸入新資料夾名稱</label>
      <div class="folder-input-group">
        <input type="text" id="new-folder-input" placeholder="例如: 多益核心單字">
        <button type="button" id="btn-cancel-new-folder" class="btn btn-secondary">取消</button>
      </div>
    </div>

    <div class="tabs">
      <button type="button" id="tab-single" class="tab active">✏️ 單筆新增</button>
      <button type="button" id="tab-bulk" class="tab">📋 批次貼上</button>
    </div>

    <!-- 單筆 -->
    <form id="add-word-form" onsubmit="return false;">
      <div class="form-group">
        <label for="word-en">🔤 英文單字</label>
        <div class="folder-input-group">
          <input type="text" id="word-en" placeholder="例如: apple（按 Enter 可自動查中文）" autocomplete="off" autocapitalize="none" required>
          <button type="button" id="btn-auto-translate" class="btn btn-accent">✨ 自動查中文</button>
        </div>
      </div>

      <div class="form-group">
        <label for="word-pos">🏷️ 詞性</label>
        <select id="word-pos">
          <option value="">(無/其他)</option>
          <option value="n.">n. (名詞)</option>
          <option value="v.">v. (動詞)</option>
          <option value="adj.">adj. (形容詞)</option>
          <option value="adv.">adv. (副詞)</option>
          <option value="prep.">prep. (介系詞)</option>
          <option value="conj.">conj. (連接詞)</option>
          <option value="phr.">phr. (片語)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="word-ch">🇹🇼 中文意思</label>
        <input type="text" id="word-ch" placeholder="例如: 蘋果" autocomplete="off" required>
      </div>

      <button type="submit" class="btn btn-submit">儲存單字</button>
    </form>

    <!-- 批次 -->
    <form id="bulk-form" class="hidden" onsubmit="return false;">
      <div class="bulk-help">
        一行一個單字，格式擇一即可：<br>
        <b>apple 蘋果</b>　｜　<b>apple, 蘋果</b>　｜　<b>apple, n., 蘋果</b>　｜　<b>apple = 蘋果</b>　｜　<b>apple [Tab] 蘋果</b><br>
        （可直接從 Excel / Google 試算表複製兩欄貼上；沒寫詞性就留空）
      </div>
      <div class="form-group">
        <button type="button" id="btn-paste" class="btn btn-secondary btn-sm" style="margin-bottom:8px;">📋 從剪貼簿貼上</button>
        <textarea id="bulk-text" placeholder="apple, n., 蘋果&#10;run, v., 跑步&#10;quickly, adv., 快速地"></textarea>
        <div id="bulk-preview" class="bulk-preview">貼上內容後會顯示解析結果</div>
      </div>
      <button type="submit" id="bulk-submit" class="btn btn-submit">批次儲存</button>
    </form>

    <div id="add-msg" class="msg"></div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/common.js?v=3500"></script>
<script>
  // 分頁切換不依賴 add.js：即使其他程式出錯，單筆 / 批次也能切換
  (function () {
    function sw(bulk) {
      document.getElementById("tab-single").classList.toggle("active", !bulk);
      document.getElementById("tab-bulk").classList.toggle("active", bulk);
      document.getElementById("add-word-form").classList.toggle("hidden", bulk);
      document.getElementById("bulk-form").classList.toggle("hidden", !bulk);
    }
    document.getElementById("tab-single").onclick = function () { sw(false); };
    document.getElementById("tab-bulk").onclick = function () { sw(true); };

    // 診斷：common.js 沒載入時直接在頁面上提示
    if (!window.EH) {
      var box = document.createElement("div");
      box.className = "auth-msg error";
      box.textContent = "⚠️ 找不到 js/common.js，請確認它放在 js 資料夾內並重新整理（其餘功能需要它才能運作）。";
      document.querySelector(".card").insertBefore(box, document.querySelector(".card").firstChild);
    }
  })();
</script>
<script src="js/add.js?v=3200"></script>
<script>
  if (window.EH && !window.__EH_ADD_READY) {
    var b = document.createElement("div");
    b.className = "auth-msg error";
    b.textContent = "⚠️ js/add.js 沒有正確載入（可能是舊版或檔案有誤），目前按儲存不會有作用。請確認已用最新的 add.js 覆蓋 js/add.js，並清除瀏覽器快取後重新整理。";
    var c = document.querySelector(".card");
    c.insertBefore(b, c.firstChild);
  }
</script>
</body>
</html>
