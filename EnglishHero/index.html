<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Hero</title>
  <link rel="stylesheet" href="css/style.css?v=2026">
</head>
<body class="dashboard-body">

<header class="main-header">
  <div class="logo">📚 English Hero</div>
  <div class="user-panel">
    <span id="user-display">載入中...</span>
    <button id="btn-logout" class="btn-logout">登出</button>
  </div>
</header>

<div class="main-container">
  <div class="welcome-box">
    <h1>準備好提升英文實力了嗎？</h1>
    <p>自訂專屬單字庫，高效率背誦與自選測驗！</p>
  </div>

  <div class="hero-actions-grid" style="grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));">
    <!-- 按鈕 1：新增單字 -->
    <a href="add.html?v=2026" class="action-hero-card primary-card">
      <div class="card-badge">擴充詞彙</div>
      <div class="action-icon">➕</div>
      <h2>新增單字</h2>
      <p>建立自訂分類，收錄新單字與中文釋義到雲端資料庫</p>
      <span class="btn-action">前往新增 ➔</span>
    </a>
  
    <!-- 按鈕：智慧背單字計畫 -->
    <a href="plan.html?v=2088" class="action-hero-card accent-card">
      <div class="card-badge">進度規劃</div>
      <div class="action-icon">🎯</div>
      <h2>背單字計畫</h2>
      <p>選擇指定題庫資料夾，設定完成天數，智慧平均分配每日進度</p>
      <span class="btn-action">開始規劃 ➔</span>
    </a>
    <!-- 按鈕 2：背單字 -->
    <a href="study.html?v=2026" class="action-hero-card primary-card">
      <div class="card-badge">自主學習</div>
      <div class="action-icon">📖</div>
      <h2>背單字</h2>
      <p>瀏覽雲端單字卡，翻卡查看中文無壓力記憶</p>
      <span class="btn-action">進入單字庫 ➔</span>
    </a>
    <!-- 按鈕 4：精選題庫專區 -->
    <a href="preset_library.html?v=2077" class="action-hero-card primary-card">
      <div class="card-badge">官方題庫</div>
      <div class="action-icon">📚</div>
      <h2>精選題庫專區</h2>
      <p>一鍵匯入 2000 單與會考高頻單字，迅速擴充您的字庫</p>
      <span class="btn-action">選擇題庫 ➔</span>
    </a>
    <!-- 按鈕 3：考單字 -->
    <a href="quiz.html?v=2026" class="action-hero-card secondary-card">
      <div class="card-badge">實力測驗</div>
      <div class="action-icon">✏️</div>
      <h2>考單字</h2>
      <p>支援「填空拼寫」與「連線配對」兩種互動測驗模式</p>
      <span class="btn-action">開始測驗 ➔</span>
    </a>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/index.js?v=2026"></script>
</body>
</html>
